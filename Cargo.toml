[package]
name = "backbone-foundation-ext"
version = "0.1.0"
edition = "2021"
description = "Declarative automations as a REACTION layer over the staged outbox — rules subscribe to transition/lifecycle integration events through the host-wired gateway port, fire in-transaction with inbox dedup (at-least-once delivery, exactly-once effect), under a three-leg recursion guard (produced-event self-trigger exclusion + dedup + causal depth cap), with a declared-posture adaptive scheduler that is inactive unless a time rule exists (Odoo base_automation port)"

[lib]
path = "src/lib.rs"

[dependencies]
# -----------------------------------------------------------------------------
# Backbone Framework crates
#
# Pulled directly from the public framework repository so this module works
# anywhere on disk without path fix-up. Pinned to the framework tag current
# at module creation (single-rev policy: every framework source in the
# resolved graph resolves to this one tag).
# -----------------------------------------------------------------------------
backbone-core = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.11", features = ["postgres"] }
backbone-orm = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.11" }
backbone-auth = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.11" }
# The envelope + handler contract this module consumes (the host registers
# the reaction handler on ITS integration bus — this module never self-
# registers).
backbone-messaging = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.11" }
# Framework plumbing: outbox::stage (this module's own AutomationFired
# events, staged in-transaction with the run) + inbox::once (the
# (consumer, event_id) dedup that turns the relay's at-least-once delivery
# into an exactly-once effect).
backbone-outbox = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.11" }

# Sibling modules: NONE by design. Automations are a reaction layer over
# OTHER modules' events; every reach into a watched module's records goes
# through the gateway port trait the composing host wires (validated write
# services host-side). There is no cargo edge, no DB FK, and no schema
# boundary crossing from this crate to any domain module — a host that has
# not composed the watched module simply has a gateway that refuses.

# Core async runtime and serialization
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# v5 for the scheduler's DETERMINISTIC per-(rule, record, generation) dedup
# ids — a re-tick mints the same id so inbox dedup makes each due fire
# exactly-once without a ledger of its own.
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Database (PostgreSQL primary)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# HTTP framework (Axum) — present for the generated read-only surface only;
# this module exposes NO write routes and NO public automation routes.
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Logging
tracing = "0.1"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
config = "0.14"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
pretty_assertions = "1.0"

# Integration testing framework — generated CRUD suites hit a live server
# via reqwest (skip-safe without one); the fail-hard probes run against
# disposable scratch Postgres databases directly.
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
jsonwebtoken = "9.3"
